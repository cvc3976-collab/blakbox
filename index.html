:root{--bg:#f1f1ef;--s:#fff;--s2:#e8e8e6;--t:#111;--m:#666;--b:#111;--bt:#fff;--ln:#d8d8d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161616;--s:#1f1f1f;--s2:#2a2a2a;--t:#f2f2f2;--m:#999;--b:#f2f2f2;--bt:#111;--ln:#333}}
:root[data-theme=dark]{--bg:#161616;--s:#1f1f1f;--s2:#2a2a2a;--t:#f2f2f2;--m:#999;--b:#f2f2f2;--bt:#111;--ln:#333}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#000;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.hw{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px;padding:6px 16px;flex-wrap:wrap}
.logo{height:56px;display:block}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}nav a{color:#ddd;text-decoration:none;padding:8px 12px;border-radius:99px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;transition:.2s}nav a:hover,nav a.on{background:#fff;color:#000}
.sb{background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:99px;padding:8px 14px;width:200px}
main{max-width:1200px;margin:auto;padding:20px 16px 60px;min-height:70vh}h1,h2,h3{letter-spacing:-.02em;margin:0 0 12px;text-transform:uppercase}
.hero{background:#000;color:#fff;border-radius:18px;padding:40px 28px;display:grid;gap:14px;background-image:radial-gradient(circle at 85% 20%,#333,#000 60%)}.hero h1{font-size:clamp(28px,5vw,54px);line-height:1}.hero p{color:#bbb;max-width:520px;margin:0}
.btn{background:var(--b);color:var(--bt);border:0;border-radius:10px;padding:12px 20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s;font-size:14px}.btn:hover{transform:translateY(-2px);opacity:.85}.hero .btn{background:#fff;color:#000;justify-self:start}.btn.g{background:var(--s2);color:var(--t)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid var(--ln);background:var(--s);color:var(--t);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:13px}.chip.on{background:var(--b);color:var(--bt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--s);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:.25s;border:1px solid var(--ln)}.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px #0002}
.ph{aspect-ratio:1;background:var(--s2) center/cover;display:grid;place-items:center;color:var(--m);font-weight:800;transition:.4s}.card:hover .ph{transform:scale(1.04)}.ci{padding:12px}.ci b{display:block}.ci small{color:var(--m)}.pr{font-weight:800;margin-top:4px}
.fv{position:absolute;top:8px;right:8px;background:var(--s);border:0;border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:17px;z-index:2}.sec{margin:34px 0}.row{display:flex;justify-content:space-between;align-items:end;gap:10px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:30px}@media(max-width:760px){.pd{grid-template-columns:1fr}.sb{width:100%}}
.big{aspect-ratio:1;border-radius:14px;background:var(--s2) center/contain no-repeat;border:1px solid var(--ln)}.th{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.th img,.qcg img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--b)}
.qcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.qcg img{width:100%;height:150px;transition:.2s}.qcg img:hover{transform:scale(1.03)}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:50;cursor:zoom-out}#lb img{max-width:94vw;max-height:90vh;transition:transform .2s}#lb.z img{transform:scale(1.8)}
.box{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 10px}
.tag{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.x{color:#c00;cursor:pointer;font-weight:700}.al{display:flex;gap:8px;align-items:center;flex-wrap:wrap}footer{text-align:center;color:var(--m);padding:30px;font-size:12px;letter-spacing:.2em}

if(tab=="prod"){const p=ed||null;o+=p?pform():`<p><button class="btn" onclick="ed={name:'',price:'',category:'Vêtements',description:'',bbd_url:'',images:[]};admin()">+ Ajouter un produit</button></p><div class="box">${P.map(x=>`<div class="al"><b>${e(x.name)}</b><span class="x" style="color:inherit" onclick="ed={...P.find(z=>z.id=='${x.id}')};admin()">Modifier</span><span class="x" onclick="dp('${x.id}')">Supprimer</span></div>`).join("")||"Aucun produit."}</div>`}
else if(tab=="news")o+=`<div class="box"><input id="nt" placeholder="Titre"><textarea id="nx" placeholder="Texte"></textarea><input type="file" id="ni" accept="image/*"><button class="btn" onclick="sn()">Publier</button></div>`+N.map(n=>`<div class="box al"><b>${e(n.title)}</b><span class="tag">${dt(n.created_at)}</span><span class="x" onclick="dn('${n.id}')">Supprimer</span></div>`).join("");
else if(tab=="stats"){const[v,m]=await Promise.all([sb.from("site_stats").select("visits"),sb.from("messages").select("id",{count:"exact",head:true})]);o+=`<div class="box">Produits : <b>${P.length}</b> · Visiteurs (visites) : <b>${(v.data||[]).reduce((a,x)=>a+x.visits,0)}</b> · Messages : <b>${m.count||0}</b></div><div class="box"><h3>Produits les plus consultés</h3>${[...P].sort((a,b)=>b.views-a.views).slice(0,8).map(x=>`<div>${e(x.name)} — <b>${x.views}</b> vues</div>`).join("")||"—"}</div>`}
else{const[cs,ms]=await Promise.all([sb.from("conversations").select("*").order("last_message_at",{ascending:false}),sb.from("messages").select("conversation_id,sender_id").eq("read",false)]),un={};(ms.data||[]).forEach(m=>{if(m.sender_id!=me.id)un[m.conversation_id]=(un[m.conversation_id]||0)+1});const L=(cs.data||[]).filter(c=>c.archived==arch),cur=(cs.data||[]).find(c=>c.id==openC);
o+=`<div class="chips"><span class="chip ${arch?"":"on"}" onclick="arch=false;openC=null;admin()">Actives</span><span class="chip ${arch?"on":""}" onclick="arch=true;openC=null;admin()">Archivées</span></div><div class="two"><div class="box">${L.map(c=>`<div class="cv ${c.id==openC?"on":""}" onclick="openC='${c.id}';admin()">${e(c.email||"client")}${un[c.id]?`<span class="badge">${un[c.id]}</span>`:""}<br><small class="tag">${dt(c.last_message_at)}</small></div>`).join("")||'<p class="tag">Aucune conversation.</p>'}</div><div class="box">${cur?`<div class="row"><b>${e(cur.email)}</b><button class="btn g" onclick="ar('${cur.id}',${!cur.archived})">${cur.archived?"Désarchiver":"Archiver"}</button></div><div id="th" class="thr"></div><textarea id="mi" placeholder="Réponse…"></textarea><button class="btn" onclick="send('${cur.id}')">Répondre</button>`:'<p class="tag">Sélectionnez une conversation.</p>'}</div></div>`}
$("#app").innerHTML=o;if(tab=="msg"&&openC)thread(openC)}
async function ar(id,v){await sb.from("conversations").update({archived:v}).eq("id",id);openC=null;admin()}
function pform(){const p=ed,q=QC.filter(x=>x.product_id==p.id);return `<div class="box"><h3>${p.id?"Modifier":"Ajouter"} un produit</h3><label>Nom<input id="fn" value="${e(p.name)}"></label><label>Prix indicatif<input id="fp" value="${e(p.price)}"></label><label>Catégorie<select id="fc">${CATS.map(c=>`<option ${c==p.category?"selected":""}>${c}</option>`).join("")}</select></label><label>Description<textarea id="fd">${e(p.description)}</textarea></label><label>Lien BBDBuy<input id="fl" value="${e(p.bbd_url)}"></label><label>Photos produit<input type="file" id="fi" accept="image/*" multiple></label><div class="al">${p.images.map((u,i)=>`<span class="al"><img src="${e(u)}" width="48" height="48" style="border-radius:6px;object-fit:cover"><span class="x" onclick="cap();ed.images.splice(${i},1);admin()">✕</span></span>`).join("")}</div><label>Photos QC<input type="file" id="fq" accept="image/*" multiple></label><div class="al">${q.map(x=>`<span class="al"><img src="${e(x.url)}" width="48" height="48" style="border-radius:6px;object-fit:cover"><span class="x" onclick="dq('${x.id}')">✕</span></span>`).join("")}</div><p><button class="btn" onclick="sp()">Enregistrer</button> <button class="btn g" onclick="ed=null;admin()">Annuler</button></p></div>`}
function cap(){Object.assign(ed,{name:$("#fn").value,price:$("#fp").value,category:$("#fc").value,description:$("#fd").value,bbd_url:$("#fl").value})}
async function upl(fs){const o=[];for(const f of fs){const k=Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+f.name.replace(/[^\w.]/g,"_"),r=await sb.storage.from("media").upload(k,f);if(r.error)throw r.error;o.push(sb.storage.from("media").getPublicUrl(k).data.publicUrl)}return o}
async function sp(){cap();if(!ed.name||!ed.bbd_url)return alert("Nom et lien BBDBuy requis.");try{const o={name:ed.name,price:ed.price,category:ed.category,description:ed.description,bbd_url:ed.bbd_url,images:[...ed.images,...await upl($("#fi").files)]};const r=ed.id?await sb.from("products").update(o).eq("id",ed.id).select().single():await sb.from("products").insert(o).select().single();if(r.error)throw r.error;const qs=await upl($("#fq").files);if(qs.length){const w=await sb.from("qc_photos").insert(qs.map((u,i)=>({product_id:r.data.id,url:u,position:Date.now()%1e9+i})));if(w.error)throw w.error}ed=null;await load();admin()}catch(x){alert("Erreur : "+fmt(x))}}
async function dp(id){if(confirm("Supprimer ce produit ?")){await sb.from("products").delete().eq("id",id);await load();admin()}}
async function dq(id){if(confirm("Supprimer cette photo QC ?")){cap();await sb.from("qc_photos").delete().eq("id",id);await load();admin()}}
async function sn(){const t=$("#nt").value.trim();if(!t)return;try{const i=(await upl($("#ni").files))[0]||null,r=await sb.from("news").insert({title:t,body:$("#nx").value,image_url:i});if(r.error)throw r.error;await load();admin()}catch(x){alertfmt(x)}}
async function dn(id){if(confirm("Supprimer ?")){await sb.from("news").delete().eq("id",id);await load();admin()}}
addEventListener("hashchange",()=>{ed=null;R();scrollTo(0,0)});
function fmt(x){if(!x)return"inconnue";if(typeof x=="string")return x;let m=x.message||"";if(typeof m!="string")m=JSON.stringify(m);["details","hint","code","statusCode","error"].forEach(k=>{if(x[k]&&typeof x[k]=="string"&&!m.includes(x[k]))m+=" | "+k+": "+x[k]});if(!m){try{m=JSON.stringify(x)}catch(_){m=String(x)}}return m}
addEventListener("unhandledrejection",ev=>err(ev.reason));addEventListener("error",ev=>err(ev.error||ev.message));
function err(x){console.error(x);let b=$("#eb");if(!b){b=document.createElement("div");b.id="eb";b.style.cssText="background:#fee;color:#900;padding:10px;text-align:center;font-weight:600";document.body.prepend(b)}b.textContent="Erreur : "+fmt(x)}
async function boot(u){me=u;if(!me&&chan){sb.removeChannel(chan);chan=null}try{await Promise.race([load(),new Promise((_,j)=>setTimeout(()=>j("Délai dépassé : Supabase ne répond pas"),8000))])}catch(x){err(x)}R()}
sb.auth.onAuthStateChange((ev,ss)=>{if(ev=="INITIAL_SESSION")return;setTimeout(()=>boot(ss?.user||null),0)});
sb.auth.getSession().then(r=>boot(r.data.session?.user||null)).catch(x=>{err(x);boot(null)});
try{if(!sessionStorage.bbv){sessionStorage.bbv=1;sb.rpc("track_visit").then(()=>{})}}catch(_){}
</script></body></html>
